services:
  ecommerce:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-ecommerce-app
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [ecommerce-net]
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ai-ecommerce-prometheus
    profiles: [monitoring]
    ports: ["9090:9090"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [ecommerce-net]
  grafana:
    image: grafana/grafana:12.1.1
    container_name: ai-ecommerce-grafana
    profiles: [monitoring]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local}
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [ecommerce-net]
networks:
  ecommerce-net:
    driver: bridge
volumes:
  grafana-data:
