---
- name: Validate local DevOps lab host
  hosts: local
  gather_facts: true
  tasks:
    - name: Show operating system
      ansible.builtin.debug:
        msg: "Ansible connected to {{ ansible_distribution }} {{ ansible_distribution_version }}"
    - name: Check Docker CLI exists
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      failed_when: false
    - name: Report Docker CLI availability
      ansible.builtin.debug:
        var: docker_version.stdout
